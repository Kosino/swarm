<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWARM — Mycelium</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        width: min(100vw, calc(100vh * 1000 / 640));
        aspect-ratio: 1000 / 640;
        display: block;
        cursor: crosshair;
        touch-action: none;
        background: #242424;
      }
      /* Demo HUD — only mounted when ?demo=1 / Pages preview. Not part of final game. */
      #demo-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
        font-family: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
        color: rgba(235, 230, 220, 0.9);
      }
      .demo-top {
        position: absolute;
        top: 10px;
        left: 12px;
        right: 12px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        flex-wrap: wrap;
      }
      .demo-clock {
        font-size: 15px;
        letter-spacing: 0.04em;
        opacity: 0.85;
        min-width: 3.2em;
      }
      .demo-speeds {
        display: flex;
        gap: 4px;
        pointer-events: auto;
      }
      .demo-speeds button {
        pointer-events: auto;
        border: 1px solid rgba(200, 195, 180, 0.35);
        background: rgba(20, 20, 18, 0.35);
        color: rgba(230, 225, 215, 0.85);
        font: inherit;
        font-size: 12px;
        padding: 3px 8px;
        cursor: pointer;
        border-radius: 2px;
      }
      .demo-speeds button.on {
        background: rgba(220, 210, 180, 0.28);
        border-color: rgba(230, 220, 190, 0.7);
      }
      .demo-wows {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 11px;
        opacity: 0.7;
        max-height: 40vh;
        overflow: hidden;
      }
      .demo-wows li {
        margin: 1px 0;
      }
      .demo-toast {
        position: absolute;
        top: 48px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        letter-spacing: 0.06em;
        padding: 6px 14px;
        background: rgba(18, 18, 16, 0.55);
        border: 1px solid rgba(220, 215, 200, 0.25);
        white-space: nowrap;
      }
      .demo-guide {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        letter-spacing: 0.02em;
        opacity: 0.8;
        text-align: center;
        max-width: 90vw;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BHziRWpJ.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="1000" height="640"></canvas>
    </div>
  </body>
</html>
