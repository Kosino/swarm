name: Deploy Pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build web sketch
        run: |
          npm ci
          npm run build

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.3-stable-linux-templates

      - name: Install Godot 4.3
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d "$HOME/godot"
          curl -sL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -o /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x "$HOME/godot"/Godot_v4.3-stable_linux.x86_64

      - name: Export Godot Web → dist/godot/
        run: |
          GODOT="$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          mkdir -p dist/godot
          "$GODOT" --headless --path godot --import
          "$GODOT" --headless --path godot --export-release "Web" "../dist/godot/index.html"
          # Ensure relative paths work under /godot/
          ls -la dist/godot/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview/
          force: false
