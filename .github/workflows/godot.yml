name: Godot Mycelium

on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/pr-preview.yml"
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot.yml"
  workflow_dispatch:

concurrency:
  group: godot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  headless-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.3-stable-linux-templates

      - name: Install Godot 4.3
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d "$HOME/godot"
          curl -sL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -o /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x "$HOME/godot"/Godot_v4.3-stable_linux.x86_64

      - name: Headless medians
        run: |
          GODOT="$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          "$GODOT" --headless --path godot --import
          "$GODOT" --headless --path godot --script res://mycelium/headless.gd | tee godot-sim.json
          python3 - <<'PY'
          import json,sys
          # first top-level JSON object in Godot stdout (pretty-printed may nest braces)
          text=open("godot-sim.json").read()
          start=text.find("{")
          if start < 0:
              sys.exit("no JSON in godot-sim.json")
          data=json.loads(text[start:])
          print("medians", data.get("medians"))
          sys.exit(0 if data.get("ok") else 1)
          PY

  export-windows:
    runs-on: ubuntu-latest
    needs: headless-sim
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.3-stable-linux-templates

      - name: Install Godot 4.3
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d "$HOME/godot"
          curl -sL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -o /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x "$HOME/godot"/Godot_v4.3-stable_linux.x86_64

      - name: Export Windows
        run: |
          GODOT="$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          mkdir -p godot/export/windows
          "$GODOT" --headless --path godot --import
          "$GODOT" --headless --path godot --export-release "Windows Desktop" "export/windows/SWARM_Mycelium.exe"
          ls -la godot/export/windows/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: swarm-mycelium-windows
          path: godot/export/windows/
          if-no-files-found: error

  export-web:
    runs-on: ubuntu-latest
    needs: headless-sim
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.3-stable-linux-templates

      - name: Install Godot 4.3
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d "$HOME/godot"
          curl -sL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -o /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x "$HOME/godot"/Godot_v4.3-stable_linux.x86_64

      - name: Export Web
        run: |
          GODOT="$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          mkdir -p godot/export/web
          "$GODOT" --headless --path godot --import
          "$GODOT" --headless --path godot --export-release "Web" "export/web/index.html"
          ls -la godot/export/web/

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: swarm-mycelium-web
          path: godot/export/web/
          if-no-files-found: error
